name: Install KiCHiGUY announcements
on:
  push:
    branches: [main]
    paths:
      - 'news-widget.js'
      - '.github/workflows/install-news-widget.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Add widget script to existing homepage without rewriting other content
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          import hashlib,re
          version=hashlib.sha256(Path('news-widget.js').read_bytes()).hexdigest()[:12]
          tag=f'<script defer src="news-widget.js?v={version}"></script>'
          pattern=r'<script\\s+defer\\s+src=["\\\']news-widget\\.js(?:\\?[^"\\\']*)?["\\\']\\s*></script>'
          if re.search(pattern,s):
              updated=re.sub(pattern,lambda _:tag,s,count=1)
          else:
              assert '</body>' in s, 'Cannot find body closing tag; no changes made'
              updated=s.replace('</body>',tag+'\\n</body>',1)
          if updated!=s:
              p.write_text(updated,encoding='utf-8')
              print('Updated widget script cache key:',version)
          else:
              print('Widget script already current:',version)
          PY
      - name: Commit only homepage change
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Load announcements widget on homepage"
            git push
          fi
