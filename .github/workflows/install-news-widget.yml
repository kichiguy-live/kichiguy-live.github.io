name: Install KiCHiGUY announcements
on:
  push:
    branches: [main]
    paths:
      - 'news-widget.js'
      - '.github/workflows/install-news-widget.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Add widget script to existing homepage without rewriting other content
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script defer src="news-widget.js"></script>'
          if tag in s:
              print('News widget already installed')
          else:
              assert '</body>' in s, 'Cannot find body closing tag; no changes made'
              s=s.replace('</body>',tag+'\n</body>',1)
              p.write_text(s,encoding='utf-8')
              print('News widget installed')
          PY
      - name: Commit only homepage change
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Load announcements widget on homepage"
            git push
          fi
