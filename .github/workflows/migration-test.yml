name: Extract migration archive
on:
  push:
    branches: [site-migration-test]
    paths: ['.github/workflows/migration-test.yml']
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          import zipfile, pathlib
          with zipfile.ZipFile('KiCHiGUY-site-migration.zip') as z:
              files=[n for n in z.namelist() if not n.endswith('/')]
              for n in files:
                  p=pathlib.PurePosixPath(n)
                  if p.parts[0]=='KiCHiGUY-site-migration': p=pathlib.PurePosixPath(*p.parts[1:])
                  assert not p.is_absolute() and '..' not in p.parts
                  assert str(p)=='index.html' or p.parts[0] in ('js','images'), str(p)
                  dest=pathlib.Path(p)
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  dest.write_bytes(z.read(n))
          PY
          for f in js/*.js; do node --check "$f" || exit 1; done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html js images
          git commit -m 'Extract migration files for testing'
          git push origin HEAD:site-migration-test
