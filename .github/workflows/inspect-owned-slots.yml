name: Inspect slot ownership markup
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/inspect-owned-slots.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find ownership entries
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          for pattern in ['喰霊','フェアリーテイル','FAIRY TAIL','過去所持','現在所持']:
              matches=list(re.finditer(re.escape(pattern),s,re.I))
              print('PATTERN',pattern,'COUNT',len(matches))
              for m in matches[:8]:
                  print('AT',m.start(),'CONTEXT',repr(s[max(0,m.start()-180):m.end()+180]))
          out=[]
          for pattern in ['喰霊','フェアリーテイル','FAIRY TAIL']:
              matches=list(re.finditer(re.escape(pattern),s,re.I))
              out.append(f'PATTERN {pattern} COUNT {len(matches)}')
              for m in matches[:12]:
                  out.append(repr(s[max(0,m.start()-450):m.end()+450]))
          Path('slot-inspection.txt').write_text('\\n'.join(out),encoding='utf-8')
          PY
      - name: Commit inspection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add slot-inspection.txt
          git commit -m "Inspect slot collection entries" || true
          git push
